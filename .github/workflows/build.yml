name: SFT1200 firmware build

on:
  workflow_dispatch:

env:
  TZ: Asia/Shanghai
  SDK_REPO: https://github.com/Siflower/1806_SDK.git
  SDK_BRANCH: release2.0.0

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v4

      - name: Install host dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential gawk git libncurses-dev zlib1g-dev libssl-dev \
            flex quilt xsltproc libxml-parser-perl unzip wget file \
            python2 python3 python3-distutils device-tree-compiler swig

      - name: Clone Siflower SDK
        run: |
          git clone --depth 1 -b "$SDK_BRANCH" "$SDK_REPO" sdk
          echo "SDK_COMMIT=$(git -C sdk rev-parse HEAD)" | tee -a "$GITHUB_ENV"

      - name: Apply host compatibility patches
        run: |
          if [ -d patches/host ] && ls patches/host/*.patch >/dev/null 2>&1; then
            for p in patches/host/*.patch; do
              echo "applying $p"
              git -C sdk apply --whitespace=nowarn "$GITHUB_WORKSPACE/$p"
            done
          fi

      - name: Apply SFT1200 board files
        run: ./scripts/apply-board.sh sdk

      - name: Setup feeds (pinned openwrt-18.06)
        working-directory: sdk/openwrt-18.06
        run: |
          cp "$GITHUB_WORKSPACE/feeds.conf" feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Patch feeds for modern host toolchain
        working-directory: sdk/openwrt-18.06
        run: |
          # gcc 11 miscompiles perl 5.28 host miniperl at -O2 (miniperl segfaults).
          # perl's compile line is "$cc ... $ccflags ... $optimize ...", so -Accflags=-O1
          # is overridden by the default -O2; only -Doptimize lowers it. Idempotent.
          if grep -q -- '-Doptimize=' feeds/packages/lang/perl/Makefile; then
            sed -i 's/-Doptimize="-O2"/-Doptimize="-O1"/; s/-Doptimize=-O2/-Doptimize=-O1/' feeds/packages/lang/perl/Makefile
          else
            sed -i 's|\./Configure -der -Uusedl|./Configure -der -Doptimize=-O1 -Uusedl|' feeds/packages/lang/perl/Makefile
          fi
          grep -n -- 'Doptimize=' feeds/packages/lang/perl/Makefile

          # xtables-addons 2.14: backport ip_route_me_harder 4-arg signature (OpenWrt PR 14029)
          if [ -d feeds/packages/net/xtables-addons/patches ]; then
            cp "$GITHUB_WORKSPACE/patches/feeds/202-fix-route-me-harder.patch" feeds/packages/net/xtables-addons/patches/
            echo "Installed 202-fix-route-me-harder.patch to xtables-addons"
          fi

      - name: Generate .config
        run: ./scripts/gen-config.sh sdk/openwrt-18.06

      - name: Download sources
        working-directory: sdk/openwrt-18.06
        run: make download -j8

      - name: Build
        working-directory: sdk/openwrt-18.06
        run: |
          echo "sdk=$SDK_REPO@$SDK_COMMIT" | tee build-info.txt
          make -j"$(nproc)" || make V=s -j1

      - name: Verify images
        run: ./scripts/verify-image.sh sdk/openwrt-18.06

      - name: Upload images (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: sft1200-images
          path: |
            sdk/openwrt-18.06/bin/targets/siflower/*.bin
            sdk/openwrt-18.06/bin/targets/siflower/**/*.bin
            sdk/openwrt-18.06/bin/targets/siflower/*.img
            sdk/openwrt-18.06/bin/targets/siflower/**/*.img
            sdk/openwrt-18.06/bin/targets/siflower/*.tar
            sdk/openwrt-18.06/bin/targets/siflower/**/*.tar
            sdk/openwrt-18.06/build-info.txt
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: sft1200-images
          path: images

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(date +'%Y.%m.%d-%H%M')"
          bin_file=$(find images -name "*sysupgrade.bin" | head -1)
          if [ -n "$bin_file" ]; then
            cp "$bin_file" "images/openwrt-sft1200-sysupgrade.bin"
            gh release create "$TAG" images/openwrt-sft1200-sysupgrade.bin images/build-info.txt               --title "SFT1200 Build $TAG"               --notes "Automated build release for GL-SFT1200 (with Argon Theme)"
          fi
